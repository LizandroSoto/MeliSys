<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi App</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #121212;
    color: #e0e0e0;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
  }
  h1 { color: #f5f5f5; margin-bottom: 5px; }
  .tabs { display: flex; gap: 8px; margin: 20px 0; }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    cursor: pointer;
    color: #aaa;
  }
  .tab.active { background: #333; color: #fff; border-color: #555; }
  .seccion { display: none; }
  .seccion.active { display: block; }

  input, button {
    padding: 10px;
    font-size: 15px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1e1e1e;
    color: #e0e0e0;
  }
  input { width: 65%; }
  button {
    background: #444;
    cursor: pointer;
    border: 1px solid #555;
  }
  button:hover { background: #555; }

  ul { list-style: none; padding: 0; margin-top: 15px; }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  li.vista span { text-decoration: line-through; color: #777; }
  li .izq { display: flex; align-items: center; gap: 10px; }
  .borrar { background: transparent; border: none; color: #888; cursor: pointer; font-size: 16px; }
  .borrar:hover { color: #e57373; }

  .calendario { margin-top: 20px; }
  .mes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .mes-header button { padding: 6px 12px; }
  .grid-dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .grid-dias div { padding: 8px 0; font-size: 13px; }
  .dia-nombre { color: #777; font-size: 11px; }
  .dia {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    cursor: pointer;
    min-height: 36px;
    position: relative;
  }
  .dia:hover { background: #262626; }
  .dia.hoy { border-color: #777; }
  .dia.tiene-evento::after {
    content: '';
    width: 5px; height: 5px;
    background: #90caf9;
    border-radius: 50%;
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
  }
  .dia.vacio { background: transparent; border: none; cursor: default; }

  .lista-recordatorios { margin-top: 20px; }
  .recordatorio-item { font-size: 14px; }
  .fecha-tag { color: #90caf9; margin-right: 8px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Mi App</h1>

  <div class="tabs">
    <div class="tab active" data-tab="peliculas">🎬 Películas</div>
    <div class="tab" data-tab="calendario">📅 Calendario</div>
  </div>

  <!-- PELÍCULAS -->
  <div class="seccion active" id="peliculas">
    <input type="text" id="tituloPelicula" placeholder="Nombre de la película...">
    <button onclick="agregarPelicula()">Agregar</button>
    <ul id="listaPeliculas"></ul>
  </div>

  <!-- CALENDARIO -->
  <div class="seccion" id="calendario">
    <div class="calendario">
      <div class="mes-header">
        <button onclick="cambiarMes(-1)">←</button>
        <strong id="mesTitulo"></strong>
        <button onclick="cambiarMes(1)">→</button>
      </div>
      <div class="grid-dias" id="gridDias"></div>
    </div>

    <div id="formRecordatorio" style="display:none; margin-top:15px;">
      <div id="fechaSeleccionadaTexto" style="margin-bottom:8px; color:#90caf9;"></div>
      <input type="text" id="textoRecordatorio" placeholder="Recordatorio...">
      <button onclick="agregarRecordatorio()">Agregar</button>
    </div>

    <div class="lista-recordatorios">
      <ul id="listaRecordatorios"></ul>
    </div>
  </div>

<script>
  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.seccion').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    };
  });

  // ---------- PELÍCULAS ----------
  async function cargarPeliculas() {
    const res = await fetch('/api/peliculas');
    const datos = await res.json();
    const lista = document.getElementById('listaPeliculas');
    lista.innerHTML = '';
    datos.forEach(p => {
      const li = document.createElement('li');
      if (p.vista) li.classList.add('vista');
      li.innerHTML = `
        <div class="izq">
          <input type="checkbox" ${p.vista ? 'checked' : ''} onchange="marcarVista(${p.id}, this.checked)">
          <span>${p.titulo}</span>
        </div>
        <button class="borrar" onclick="borrarPelicula(${p.id})">✕</button>
      `;
      lista.appendChild(li);
    });
  }

  async function agregarPelicula() {
    const input = document.getElementById('tituloPelicula');
    if (!input.value.trim()) return;
    await fetch('/api/peliculas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ titulo: input.value.trim() })
    });
    input.value = '';
    cargarPeliculas();
  }

  async function marcarVista(id, vista) {
    await fetch(`/api/peliculas/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ vista })
    });
    cargarPeliculas();
  }

  async function borrarPelicula(id) {
    await fetch(`/api/peliculas/${id}`, { method: 'DELETE' });
    cargarPeliculas();
  }

  // ---------- CALENDARIO ----------
  let fechaActual = new Date();
  let fechaSeleccionada = null;
  let recordatorios = [];

  async function cargarRecordatorios() {
    const res = await fetch('/api/recordatorios');
    recordatorios = await res.json();
    dibujarCalendario();
    dibujarListaRecordatorios();
  }

  function dibujarCalendario() {
    const anio = fechaActual.getFullYear();
    const mes = fechaActual.getMonth();
    const nombresMes = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    document.getElementById('mesTitulo').textContent = `${nombresMes[mes]} ${anio}`;

    const grid = document.getElementById('gridDias');
    grid.innerHTML = '';
    ['D','L','M','M','J','V','S'].forEach(d => {
      const el = document.createElement('div');
      el.className = 'dia-nombre';
      el.textContent = d;
      grid.appendChild(el);
    });

    const primerDia = new Date(anio, mes, 1).getDay();
    const totalDias = new Date(anio, mes + 1, 0).getDate();
    const hoy = new Date();

    for (let i = 0; i < primerDia; i++) {
      const vacio = document.createElement('div');
      vacio.className = 'dia vacio';
      grid.appendChild(vacio);
    }

    for (let dia = 1; dia <= totalDias; dia++) {
      const fechaStr = `${anio}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
      const celda = document.createElement('div');
      celda.className = 'dia';
      celda.textContent = dia;
      if (recordatorios.some(r => r.fecha === fechaStr)) celda.classList.add('tiene-evento');
      if (fechaStr === hoy.toISOString().slice(0,10)) celda.classList.add('hoy');
      celda.onclick = () => seleccionarFecha(fechaStr, dia, nombresMes[mes]);
      grid.appendChild(celda);
    }
  }

  function seleccionarFecha(fechaStr, dia, nombreMes) {
    fechaSeleccionada = fechaStr;
    document.getElementById('formRecordatorio').style.display = 'block';
    document.getElementById('fechaSeleccionadaTexto').textContent = `Recordatorio para el ${dia} de ${nombreMes}`;
  }

  async function agregarRecordatorio() {
    const input = document.getElementById('textoRecordatorio');
    if (!input.value.trim() || !fechaSeleccionada) return;
    await fetch('/api/recordatorios', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fecha: fechaSeleccionada, texto: input.value.trim() })
    });
    input.value = '';
    cargarRecordatorios();
  }

  async function borrarRecordatorio(id) {
    await fetch(`/api/recordatorios/${id}`, { method: 'DELETE' });
    cargarRecordatorios();
  }

  function dibujarListaRecordatorios() {
    const lista = document.getElementById('listaRecordatorios');
    lista.innerHTML = '';
    recordatorios.forEach(r => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="recordatorio-item"><span class="fecha-tag">${r.fecha}</span>${r.texto}</div>
        <button class="borrar" onclick="borrarRecordatorio(${r.id})">✕</button>
      `;
      lista.appendChild(li);
    });
  }

  function cambiarMes(delta) {
    fechaActual.setMonth(fechaActual.getMonth() + delta);
    dibujarCalendario();
  }

  cargarPeliculas();
  cargarRecordatorios();
</script>
</body>
</html>
